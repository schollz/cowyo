<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.SEO.Title}}</title>
    <meta name="description" content="{{.SEO.Description}}" />
    <meta
      name="robots"
      content="{{.SEO.Robots}}"
    />
    <meta name="googlebot" content="{{.SEO.Robots}}" />
    <meta name="bingbot" content="{{.SEO.Robots}}" />
    <link rel="canonical" href="{{.SEO.CanonicalURL}}" />
    <link
      rel="sitemap"
      type="application/xml"
      href="{{.SEO.SitemapURL}}"
    />

    <meta name="application-name" content="cowyo" />
    <meta name="apple-mobile-web-app-title" content="cowyo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:site_name" content="cowyo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="{{.SEO.OpenGraphType}}" />
    <meta property="og:title" content="{{.SEO.Title}}" />
    <meta property="og:description" content="{{.SEO.Description}}" />
    <meta property="og:url" content="{{.SEO.CanonicalURL}}" />
    <meta property="og:image" content="{{.SEO.SocialImageURL}}" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="cowyo logo — a cow beside a speech bubble saying yo"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{.SEO.Title}}" />
    <meta name="twitter:description" content="{{.SEO.Description}}" />
    <meta name="twitter:image" content="{{.SEO.SocialImageURL}}" />
    <meta
      name="twitter:image:alt"
      content="cowyo logo — a cow beside a speech bubble saying yo"
    />

    <script type="application/ld+json">{{.SEO.JSONLD}}</script>

    <meta name="theme-color" content="#f0f0f0" />
    <meta name="msapplication-TileColor" content="#f0f0f0" />
    {{if .GoogleTag}}
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id={{.GoogleTag}}"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "{{.GoogleTag}}");
    </script>
    {{end}}
    <script>
      (() => {
        const storageKey = "cowyo-theme";
        const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === "light" || storedTheme === "dark") {
            document.documentElement.dataset.theme = storedTheme;
          }
        } catch {
          // Storage can be unavailable in privacy-restricted browsers.
        }

        const activeTheme =
          document.documentElement.dataset.theme ||
          (darkQuery.matches ? "dark" : "light");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            "content",
            activeTheme === "dark" ? "#171717" : "#f0f0f0",
          );
      })();
    </script>
    <meta
      name="msapplication-TileImage"
      content="/static/ms-icon-144x144.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="/static/apple-icon-57x57.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="60x60"
      href="/static/apple-icon-60x60.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="72x72"
      href="/static/apple-icon-72x72.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="76x76"
      href="/static/apple-icon-76x76.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="114x114"
      href="/static/apple-icon-114x114.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/static/apple-icon-120x120.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/static/apple-icon-144x144.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/static/apple-icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/apple-icon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/static/android-icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/static/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/static/favicon-16x16.png"
    />
    <link
      rel="preload"
      href="/static/MonaspaceKrypton-Regular.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link rel="manifest" href="/static/manifest.json" />
  </head>
  <body>
    <div
      id="remoteUpdateStatus"
      class="remote-update-status"
      role="status"
      aria-live="polite"
    >
      <span class="visually-hidden">Updated from another editor</span>
    </div>

    <div id="saveActions" class="save-actions">
      <button
        id="saveStatus"
        class="save-status"
        type="button"
        data-state="idle"
        data-tooltip="yo"
        aria-label="yo"
        aria-controls="saveMenu"
        aria-expanded="false"
        aria-haspopup="menu"
      >
        <svg
          class="cow-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M7 7 3.5 5v2.5A2.5 2.5 0 0 0 6 10h1" />
          <path d="m17 7 3.5-2v2.5A2.5 2.5 0 0 1 18 10h-1" />
          <path d="M8 6 7 3" />
          <path d="m16 6 1-3" />
          <path d="M6 10a6 6 0 0 1 12 0v4a6 6 0 0 1-12 0Z" />
          <path d="M8 15.5c0-1.4 1.8-2.5 4-2.5s4 1.1 4 2.5S14.2 18 12 18s-4-1.1-4-2.5Z" />
          <path d="M10 15.5h.01" />
          <path d="M14 15.5h.01" />
          <path d="M9 10h.01" />
          <path d="M15 10h.01" />
        </svg>
      </button>

      <div id="saveMenu" class="save-menu" role="menu" hidden>
        <button
          id="copyTextAction"
          class="save-menu-action"
          type="button"
          role="menuitem"
          data-tooltip="Copy paste text"
          aria-label="Copy paste text"
        >
          <i data-copy data-lucide="copy" aria-hidden="true"></i>
          <i
            data-copy-success
            data-lucide="check"
            aria-hidden="true"
            hidden
          ></i>
        </button>
        <button
          id="cryptoAction"
          class="save-menu-action"
          type="button"
          role="menuitem"
          data-tooltip="Encrypt paste"
          aria-label="Encrypt paste"
        >
          <i
            data-crypto-lock
            data-lucide="shield-keyhole"
            aria-hidden="true"
          ></i>
          <i
            data-crypto-unlock
            data-lucide="shield-check"
            aria-hidden="true"
            hidden
          ></i>
        </button>
        <button
          id="publishAction"
          class="save-menu-action"
          type="button"
          role="menuitemcheckbox"
          data-tooltip="Publish page"
          aria-label="Publish page"
          aria-checked="false"
        >
          <i data-publish data-lucide="globe-2" aria-hidden="true"></i>
          <i
            data-unpublish
            data-lucide="globe-lock"
            aria-hidden="true"
            hidden
          ></i>
        </button>
        <button
          id="pageLockAction"
          class="save-menu-action"
          type="button"
          role="menuitem"
          data-tooltip="Lock page"
          aria-label="Lock page"
        >
          <i data-page-lock data-lucide="lock-keyhole" aria-hidden="true"></i>
          <i
            data-page-unlock
            data-lucide="unlock-keyhole"
            aria-hidden="true"
            hidden
          ></i>
        </button>
        <button
          id="selfDestructAction"
          class="save-menu-action"
          type="button"
          role="menuitemcheckbox"
          data-tooltip="Self destruct after next load"
          aria-label="Self destruct after next load"
          aria-checked="false"
        >
          <i data-lucide="bomb" aria-hidden="true"></i>
        </button>
        <button
          id="themeAction"
          class="save-menu-action"
          type="button"
          role="menuitem"
          data-tooltip="Use dark mode on this device"
          aria-label="Use dark mode on this device"
        >
          <i data-theme-dark data-lucide="moon" aria-hidden="true"></i>
          <i
            data-theme-light
            data-lucide="sun"
            aria-hidden="true"
            hidden
          ></i>
        </button>
        <a
          class="save-menu-action"
          href="/about"
          role="menuitem"
          data-tooltip="About cowyo"
          aria-label="About cowyo"
        >
          <i data-lucide="info" aria-hidden="true"></i>
        </a>
      </div>

      <span
        id="saveStatusText"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      >Saved</span>
    </div>

    <main class="editor">
      <div id="linkOverlay" aria-hidden="true"></div>
      <textarea
        autofocus
        placeholder="type..."
        spellcheck="false"
        aria-label="Paste content"
        data-cursor-start="{{.CursorStart}}"
        data-cursor-end="{{.CursorEnd}}"
        data-page-locked="{{.Locked}}"
        data-page-published="{{.Published}}"
        data-page-self-destruct="{{.SelfDestruct}}"
      >{{.Text}}</textarea>
    </main>

    <dialog
      id="cryptoDialog"
      class="crypto-dialog"
      aria-labelledby="cryptoSubmit"
      aria-describedby="cryptoDialogDescription"
    >
      <form id="cryptoForm">
        <div class="crypto-dialog-body">
          <p id="cryptoDialogDescription" hidden></p>
          <label for="cryptoPassword">Password</label>
          <div id="cryptoPasswordField" class="crypto-password-fields"></div>
          <p id="cryptoError" class="crypto-error" role="alert"></p>
        </div>

        <div class="crypto-dialog-actions">
          <button id="cryptoCancel" type="button">Cancel</button>
          <button id="cryptoSubmit" class="crypto-submit" type="submit">
            Encrypt
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
